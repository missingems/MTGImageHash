name: MTG Indexing

on:
  schedule:
    # Twice a day. Scryfall regenerates bulk data around 09:00 UTC, so the
    # 10:17 run picks that up; the 22:17 run catches late spoiler additions.
    # Odd minutes avoid GitHub's top-of-the-hour scheduling congestion.
    - cron: '17 10,22 * * *'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Recompute every vector and start a new master version
        type: boolean
        default: false

# Each run builds on the previous deployment, so never run two at once.
concurrency:
  group: mtg-indexing
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    # Incremental runs take minutes; a full rebuild of ~105k faces takes much longer.
    timeout-minutes: 340
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Build feature-print database
        env:
          OUTPUT_DIR: site
          STATE_BASE_URL: https://missingems.github.io/MTGImageHash
          FULL_REBUILD: ${{ inputs.full_rebuild && '1' || '0' }}
        run: |
          swift indexer.swift
          cp index.html site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Commit the manifest when the published version moves. This records history
      # and keeps the repo "active" so GitHub doesn't disable the schedule after
      # 60 days without commits.
      - name: Commit manifest
        run: |
          key() { jq -r '"\(.masterVersion)/\(.latestPatch)"' "$1" 2>/dev/null || echo none; }
          if [ "$(key site/manifest.json)" = "$(key manifest.json)" ]; then
            echo "Published version unchanged; nothing to commit"
            exit 0
          fi
          cp site/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Automated DB Update: $(key manifest.json)"
          git pull --rebase && git push

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
