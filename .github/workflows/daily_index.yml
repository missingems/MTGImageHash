name: MTG Indexing

on:
  schedule:
    # Twice a day. Scryfall regenerates bulk data around 09:00 UTC, so the
    # 10:17 run picks that up; the 22:17 run catches late spoiler additions.
    # Odd minutes avoid GitHub's top-of-the-hour scheduling congestion.
    - cron: '17 10,22 * * *'
  workflow_dispatch:

# Never let two runs race each other on the release assets.
concurrency:
  group: mtg-indexing
  cancel-in-progress: false

env:
  RELEASE_TAG: db-latest

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Swift Indexer
        env:
          OUTPUT_DIR: dist
        run: swift indexer.swift

      - name: Publish to fixed-URL release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Latest pHash Database" \
              --notes "Rolling release, rebuilt twice daily by the MTG Indexing workflow. Asset URLs never change." \
              --latest
          fi
          # Data first, manifest last: a client that sees a new manifest version
          # can always fetch the matching database.
          gh release upload "$RELEASE_TAG" dist/MTG_Hashes.bplist dist/visualizer_data.json --clobber
          gh release upload "$RELEASE_TAG" dist/manifest.json --clobber
          gh release edit "$RELEASE_TAG" --notes "Rolling release, rebuilt twice daily by the MTG Indexing workflow. Asset URLs never change.

          $(cat dist/manifest.json)"

      # Shipped Mooligan builds read MTG_Hashes.bplist from raw.githubusercontent.com
      # on main, so keep it there too. Output is deterministic, so git only records
      # a new blob when the data really changed. These commits also keep the repo
      # "active", so GitHub doesn't disable this schedule after 60 days.
      - name: Commit database to main
        run: |
          cp dist/MTG_Hashes.bplist MTG_Hashes.bplist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MTG_Hashes.bplist
          if git diff --cached --quiet; then
            echo "Database unchanged; nothing to commit"
            exit 0
          fi
          cp dist/manifest.json manifest.json
          git add manifest.json
          git commit -m "Automated DB Update: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "No changes to commit"
          git pull --rebase && git push

      - name: Stage visualizer site
        run: |
          mkdir -p site
          cp index.html dist/visualizer_data.json dist/manifest.json site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
